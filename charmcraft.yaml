name: ubuntu-proposed-migration-operator
type: charm
summary: A charm to run Ubuntu proposed-migration tasks
description: A charm to run Ubuntu proposed-migration tasks

base: ubuntu@24.04
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

config:
  options:
    amqp_password:
      type: string
      default: ""
      description: The password used to authenticate with AMQP.
    swift_url:
      type: string
      default: https://radosgw.ps7.canonical.com/swift/v1/AUTH_fba5670a395d47719d4d19bb585dcab6/
      description: The Swift base URL with the autopkgtest results.
    autopkgtest_url:
      type: string
      default: https://autopkgtest.ubuntu.com
      description: The base URL for the autopkgtest site.
    amqp_url:
      type: string
      default: autopkgtest-amqp.internal
      description: The URL of the AMQP server.
    devel_release:
      type: string
      default: ""
      description: The current development release series.
    all_releases:
      type: string
      default: ""
      description: The list of release series undergoing proposed migration.
    launchpad_credentials:
      type: secret
      description: >-
        A Juju user secret containing the launchpadlib credentials used to
        authenticate with Launchpad. The secret must contain a single field
        named "credentials" whose value is the full contents of a launchpadlib
        credentials file (the versioned INI format produced by launchpadlib).

parts:
  charm:
    plugin: charm
    source: .
