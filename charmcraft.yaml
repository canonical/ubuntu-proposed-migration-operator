description: A charm to run Ubuntu proposed-migration tasks

base: ubuntu@24.04
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

config:
  options:
    amqp_password:
      type: string
      default: ""
      description: The password used to authenticate with AMQP.

parts:
  charm:
    plugin: charm
    source: .
